# Veilix — base stack.
#
# Production shape. Publishes nothing except the edge proxy; everything else is
# reachable only over Docker networks.
#
#   docker compose up -d                              core stack
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#                                                     core + loopback debug ports
#   docker compose --profile observability up -d      core + Prometheus/Grafana
#
# Required variables (see .env.example) fail the command rather than defaulting
# to something insecure.

name: veilix

# ---------------------------------------------------------------------------
# Networks — the isolation boundary described in ADR-0004.
#
#   backend is `internal: true`, so it has no gateway and no route off the host.
#   Any service placed ONLY on backend/edge cannot reach the internet at all.
#   SearXNG is the single service that also joins `egress`, because it is the
#   only one that needs to talk to upstream search engines.
# ---------------------------------------------------------------------------
networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    # Bound log growth. Logs carry no query text or client IP
    # (see docs/privacy.md §4), but unbounded files still fill disks.
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # -------------------------------------------------------------------------
  # Valkey — ephemeral cache and rate-limit counters.
  #
  # Persistence is switched off on purpose. `--save ""` disables RDB snapshots
  # and `--appendonly no` disables the AOF, so cached result payloads and
  # rate-limit keys exist in memory only and never touch disk. There is
  # deliberately no volume mounted here: seizing the host filesystem yields no
  # search data, because none was ever written. This is a privacy decision
  # before it is a performance one (docs/privacy.md §2.2).
  #
  # LRU eviction means memory pressure degrades the cache hit rate rather than
  # erroring, which is the correct failure mode for a cache.
  # -------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8-alpine
    container_name: veilix-valkey
    restart: unless-stopped
    # Start directly as the unprivileged valkey user (uid 999, gid 1000).
    #
    # The image entrypoint normally starts as root and uses setpriv to drop
    # privileges, which needs CAP_SETUID/CAP_SETGID — capabilities that
    # `cap_drop: ALL` removes, producing a crash loop of
    # "setpriv: setresuid failed: Operation not permitted".
    #
    # Handing back those capabilities would work. Starting as the target user
    # is strictly better: the process is never root at any point, so there is
    # no privileged window to escape from and no capability to hand back.
    user: "999:1000"
    # Nothing is persisted (see the command below), so the process needs no
    # writable path at all. Verified: it starts and serves with the whole root
    # filesystem read-only.
    read_only: true
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - backend
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

  # -------------------------------------------------------------------------
  # SearXNG — the meta-search core, run as an unmodified upstream image
  # (ADR-0001). Configuration is mounted read-only; the image is never patched.
  #
  # Publishes no ports. Its JSON API is enabled for the Veilix API to consume
  # and would be trivially abusable if exposed, which is exactly why it is
  # reachable only from `backend` (ADR-0004). The dev override file adds a
  # loopback-only port for debugging.
  # -------------------------------------------------------------------------
  searxng:
    image: searxng/searxng:2026.8.29-d226b78bc
    container_name: veilix-searxng
    restart: unless-stopped
    # Run as the image's own searxng account (uid/gid 977) instead of root.
    #
    # Upstream ships this image running Granian as uid 0 and never drops
    # privileges (SF-001). Its entrypoint guards the config chown with an
    # `id -u = 0` check, so as a non-root user that step is skipped with a
    # warning rather than failing - which is what makes this override safe.
    #
    # Root in a container is not root on the host, but it removes a layer:
    # combined with a kernel or runtime bug it shortens the path to escape.
    user: "977:977"
    networks:
      # Order matters for the default route: egress carries the gateway.
      - backend
      - egress
    read_only: true
    tmpfs:
      # SearXNG writes SQLite caches to /tmp and /var/cache/searxng. Both are
      # tmpfs rather than volumes, so the contents live in memory and never
      # reach disk.
      #
      # Checked rather than assumed: a canary query was run and both databases
      # were searched for its text. They hold engine metadata and tracker
      # patterns, no query text. The tmpfs is belt-and-braces on top of that.
      #
      # noexec/nosuid so a write primitive cannot stage and run a binary.
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/searxng:rw,noexec,nosuid,size=64m
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Fails the command with a readable message if unset, rather than
      # silently starting with upstream's "ultrasecretkey" placeholder.
      # Quoted because the failure message contains a colon, which would
      # otherwise terminate the YAML scalar.
      SEARXNG_SECRET: "${SEARXNG_SECRET:?required — generate with openssl rand -hex 32}"
      # Instance ROOT, with a trailing slash. A path suffix here makes SearXNG
      # believe it is mounted under that path and 308-redirect every request.
      SEARXNG_BASE_URL: "${VEILIX_PUBLIC_URL:-http://localhost:8088}/"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      # Granian, not uWSGI — verified against this image tag.
      GRANIAN_WORKERS: "1"
      GRANIAN_BLOCKING_THREADS: "4"
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      # The image ships wget but not curl.
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 6s
      retries: 5
      # Engine initialisation on a cold start takes a while.
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M

  # -------------------------------------------------------------------------
  # Veilix API — the only service that talks to SearXNG.
  #
  # Sits on `edge` and `backend` only. Because `backend` is internal:true and
  # `edge` carries no outward route for it, this container CANNOT REACH THE
  # INTERNET (ADR-0004). Code execution here cannot dial out, exfiltrate over
  # the network, or reach a cloud metadata endpoint.
  #
  # Hardened beyond the shared fragment: the root filesystem is read-only, so
  # a write primitive has nowhere to drop a payload. /tmp is a small tmpfs with
  # noexec and nosuid, which covers Python's need for scratch space without
  # granting a place to stage and run a binary.
  # -------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: veilix-api:local
    container_name: veilix-api
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - edge
      - backend
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    # The WHOLE of .env reaches the container, rather than a hand-maintained
    # list of variables in `environment:`.
    #
    # That list was the bug. Nine documented settings - the API-key rate limit,
    # both circuit-breaker knobs, retries, safesearch and language defaults,
    # max page, metrics toggle, CORS origins - were absent from it, so setting
    # any of them in .env did nothing at all. No error, no warning: the
    # operator changes a value, restarts, and the behaviour is unchanged.
    # Found while raising a limit for a load test and watching it not apply.
    #
    # `format: raw` is required on both files. Compose interpolates `$` in
    # every file it loads for interpolation, which mangles the Argon2 hashes
    # in .env.secrets into something that rejects every correct password.
    env_file:
      - path: .env
        format: raw
      - path: .env.secrets
        format: raw
    environment:
      # Compose-internal addressing only. These are topology rather than
      # operator configuration, and `environment:` overrides env_file, so a
      # stale VEILIX_SEARXNG_URL in someone's .env cannot break the wiring.
      VEILIX_SEARXNG_URL: "http://searxng:8080"
      VEILIX_VALKEY_URL: "valkey://valkey:6379/0"
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      # python rather than curl: the slim base has no curl, and adding one
      # would put an HTTP client into the runtime image for the sole benefit
      # of an attacker who lands there.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/live', timeout=4).status==200 else 1)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 320M

  # -------------------------------------------------------------------------
  # Caddy — the only container that publishes a port (ADR-0005).
  #
  # Terminates TLS, applies security headers, serves the SPA baked into its own
  # image, and proxies exactly two things: /api to the API, and /img to
  # SearXNG's image proxy.
  #
  # It joins `backend` for that second route alone. The API cannot serve image
  # bytes because ADR-0004 leaves it without an internet route, so the fetch has
  # to happen in the one container that has one. Only /image_proxy is exposed;
  # SearXNG's search, config, and stats endpoints stay unreachable, which is
  # what keeps `limiter: false` safe (SF-004).
  # -------------------------------------------------------------------------
  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    image: veilix-web:local
    container_name: veilix-caddy
    restart: unless-stopped
    # Matches the USER baked into the image. Stated here too so the intent is
    # visible in the topology rather than only in a Dockerfile.
    user: "10002:10002"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
      - backend
    ports:
      - "${VEILIX_HTTP_PORT:-8088}:8080"
    environment:
      # ":8080" means "any host, plain HTTP" and is the local default.
      # Setting a real hostname (search.example.com) makes Caddy request a
      # Let's Encrypt certificate, which needs public DNS and ports 80/443.
      #
      # The default is written ":-:8080" — a Compose default of ":8080" — and
      # not Caddy's own "::8080" default syntax, which Compose would try to
      # interpolate and reject.
      VEILIX_SITE_ADDRESS: "${VEILIX_SITE_ADDRESS:-:8080}"
      VEILIX_ACME_EMAIL: "${VEILIX_ACME_EMAIL:-}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      # Certificates and ACME account keys. Named volumes, not bind mounts:
      # this tree is inside a OneDrive sync root, and syncing private keys to
      # a cloud folder is not a thing to do by accident.
      - caddy_data:/data
      - caddy_config:/config
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M

  # -------------------------------------------------------------------------
  # Observability — opt-in.
  #
  #   docker compose --profile observability up -d
  #
  # Behind a profile because Prometheus and Grafana together cost roughly as
  # much memory as the entire core stack, and a 2.77 GiB Docker VM cannot spare
  # that by default. It is also the honest split: an instance can serve search
  # perfectly well without them, so they should not be a precondition for
  # running the product.
  #
  # Neither publishes a port in the production file. Grafana's login is a real
  # authentication surface and Prometheus has none at all, so exposing either
  # to the internet would undo the topology in ADR-0004. Reach them through the
  # dev override, or an SSH tunnel in production.
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: veilix-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    networks:
      # `backend` ONLY, and never published.
      #
      # Prometheus has no authentication whatsoever, so anything that can reach
      # it can read every metric and, worse, use it as a scanner. Being on an
      # internal:true network makes that structural rather than a matter of
      # remembering: the network has no gateway, so a `ports:` entry here would
      # be silently inert even if someone added one.
      #
      # Humans reach these metrics through Grafana, which proxies queries over
      # this network. Nobody needs to reach Prometheus directly.
      - backend
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days. Operational aggregates age out of usefulness quickly, and
      # unbounded retention on a small host is how a disk fills.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      # kingpin syntax: boolean flags are negated with --no-<flag>, not
      # "=false", which it rejects outright with "unexpected false".
      # Off by default anyway; stated explicitly because a reload endpoint
      # that can re-read config at runtime is a surface worth denying.
      - --no-web.enable-lifecycle
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M

  grafana:
    image: grafana/grafana:11.5.1
    container_name: veilix-grafana
    profiles: ["observability"]
    restart: unless-stopped
    user: "472:472"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      # `edge` as well as `backend`, because unlike Prometheus this one is meant
      # for a human to open. It queries Prometheus over `backend` in proxy mode,
      # so the browser never talks to Prometheus directly.
      - edge
      - backend
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD before enabling the observability profile}"
      # Anonymous access off, sign-up off, and no phoning home: this is an
      # operations tool, not a public page, and it should not report usage
      # anywhere on a privacy-first deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
      GF_SECURITY_CONTENT_TYPE_PROTECTION: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 5 http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

