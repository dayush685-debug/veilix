# Base stack. Only the edge publishes a port; everything else is
# reachable over Docker networks alone.
#
#   docker compose up -d                      core
#   ... -f docker-compose.dev.yml up -d       core + loopback debug ports
#   ... --profile observability up -d         core + Prometheus/Grafana
#   ... -f docker-compose.prod.yml up -d      core on :80/:443 with TLS

name: veilix

# ADR-0004. `backend` is internal, so it has no gateway: a service on
# backend and edge alone cannot reach the internet. SearXNG also joins
# `egress`, because it alone talks to upstream engines.
networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # Cache and rate-limit counters.
  #
  # Persistence is off and no volume is mounted, so cached payloads and
  # rate-limit keys never reach disk: seizing the filesystem yields no
  # search data because none was written. LRU eviction degrades the hit
  # rate under memory pressure instead of erroring.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: veilix-valkey
    restart: unless-stopped
    # The entrypoint would start as root and setpriv down, which needs
    # CAP_SETUID and so crash-loops under cap_drop: ALL. Starting as the
    # target user means there is never a privileged window at all.
    user: "999:1000"
    read_only: true
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - backend
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

  searxng:
    image: searxng/searxng:2026.8.29-d226b78bc
    container_name: veilix-searxng
    restart: unless-stopped
    # Upstream runs Granian as root and never drops privileges. Its
    # entrypoint guards the config chown with an `id -u = 0` test, so
    # running as 977 skips that step with a warning instead of failing.
    user: "977:977"
    networks:
      # Order matters for the default route: egress carries the gateway.
      - backend
      - egress
    read_only: true
    tmpfs:
      # SearXNG writes SQLite caches to both paths. A canary query confirmed
      # they hold engine metadata and tracker patterns, not query text; tmpfs
      # keeps them off disk regardless. noexec/nosuid so a write primitive
      # cannot stage a binary.
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/searxng:rw,noexec,nosuid,size=64m
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Quoted because the failure message contains a colon, which would
      # otherwise end the YAML scalar.
      SEARXNG_SECRET: "${SEARXNG_SECRET:?required — generate with openssl rand -hex 32}"
      # Instance root, trailing slash required: a path suffix makes SearXNG
      # think it is mounted there and 308 every request.
      SEARXNG_BASE_URL: "${VEILIX_PUBLIC_URL:-http://localhost:8088}/"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      # Granian, not uWSGI, verified against this image tag.
      GRANIAN_WORKERS: "1"
      GRANIAN_BLOCKING_THREADS: "4"
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      # The image ships wget but not curl.
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 6s
      retries: 5
      # Engine initialisation on a cold start is slow.
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M

  # The meta-search core, an unmodified upstream image (ADR-0001).
  #
  # Publishes no ports. Its JSON API is enabled for our API to consume and
  # would be trivially abusable if exposed, which is why it is reachable
  # only from `backend`.
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: veilix-api:local
    container_name: veilix-api
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - edge
      - backend
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    # The whole of .env reaches the container. A hand-maintained env: list
    # drifts silently: a setting gets plumbed through config, documented,
    # and never actually reaches the process.
    env_file:
      - path: .env
        format: raw
      # Optional overlay for credential material, so hashes can be kept apart
      # from ordinary configuration and rotated without touching .env.
      #
      # required:false is load-bearing. Without it, compose refuses to start
      # when the file is absent, and since it is gitignored that means the
      # documented quick start fails on every machine except one that already
      # has it. Caught by CI on a clean checkout, having worked locally
      # throughout only because the file happened to exist here.
      - path: .env.secrets
        format: raw
        required: false
    environment:
      # Compose-internal addressing only. These are topology rather than
      # operator configuration, and `environment:` overrides env_file, so a
      # stale VEILIX_SEARXNG_URL in someone's .env cannot break the wiring.
      VEILIX_SEARXNG_URL: "http://searxng:8080"
      VEILIX_VALKEY_URL: "valkey://valkey:6379/0"
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      # python instead of curl: the slim base has no curl, and adding one
      # would put an HTTP client into the runtime image for the sole benefit
      # of an attacker who lands there.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/live', timeout=4).status==200 else 1)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 320M

  # The only container publishing a port (ADR-0005). Serves the SPA baked
  # into its own image and proxies /api plus /img.
  #
  # It joins `backend` for /img alone: the API has no internet route, so
  # image fetches happen in the container that does. Only /image_proxy is
  # reachable, which keeps SearXNG's `limiter: false` safe.
  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    image: veilix-web:local
    container_name: veilix-caddy
    restart: unless-stopped
    # Matches the USER in the image; stated here so it is visible in topology.
    user: "10002:10002"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
      - backend
    ports:
      - "${VEILIX_HTTP_PORT:-8088}:8080"
    environment:
      # ":8080" means "any host, plain HTTP" and is the local default.
      # Setting a real hostname (search.example.com) makes Caddy request a
      # Let's Encrypt certificate, which needs public DNS and ports 80/443.
      #
      # The default is written ":-:8080", a Compose default of ":8080", and
      # not Caddy's own "::8080" default syntax, which Compose would try to
      # interpolate and reject.
      VEILIX_SITE_ADDRESS: "${VEILIX_SITE_ADDRESS:-:8080}"
      VEILIX_ACME_EMAIL: "${VEILIX_ACME_EMAIL:-}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      # Named volumes, not bind mounts: TLS private keys must not end up in a
      # synced folder.
      - caddy_data:/data
      - caddy_config:/config
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M

  # Opt-in: together these cost about as much memory as the whole core
  # stack, and an instance serves search perfectly well without them.
  #
  # Neither publishes a port in production. Prometheus has no
  # authentication at all; reach it through Grafana, or an SSH tunnel.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: veilix-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    networks:
      # backend only. Prometheus has no authentication, so anything that
      # reaches it reads every metric. On an internal network a `ports:` entry
      # here would be inert anyway.
      - backend
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      # kingpin negates booleans with --no-<flag>; "=false" is a parse error.
      - --no-web.enable-lifecycle
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M

  grafana:
    image: grafana/grafana:11.5.1
    container_name: veilix-grafana
    profiles: ["observability"]
    restart: unless-stopped
    user: "472:472"
    read_only: true
    tmpfs:
      # Grafana writes only to its data volume; /tmp covers plugin unpacking
      # and session scratch.
      - /tmp:rw,noexec,nosuid,size=32m
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      # On edge too, because unlike Prometheus this one is meant to be opened.
      # It proxies queries over backend, so the browser never reaches Prometheus.
      - edge
      - backend
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD before enabling the observability profile}"
      # No anonymous access, no sign-up, and no usage reporting.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
      GF_SECURITY_CONTENT_TYPE_PROTECTION: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    <<: *default-hardening
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 5 http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

