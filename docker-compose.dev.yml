# Veilix — development override.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Publishes internal services on the LOOPBACK INTERFACE ONLY so they can be
# inspected during development. The `127.0.0.1:` prefix is load-bearing: without
# it Docker binds 0.0.0.0 and, on many hosts, punches through the firewall —
# which would expose an unauthenticated JSON search API to the local network and
# defeat ADR-0004.
#
# NEVER use this file on a public host.

services:
  searxng:
    ports:
      # Host 18080 avoids 8080, commonly taken by other local projects.
      - "127.0.0.1:18080:8080"

  # Valkey deliberately publishes NO port, even here.
  #
  # It cannot: it sits only on `backend`, which is internal:true and therefore
  # has no NAT path, so a `ports:` entry would be silently inert. Measured —
  # the mapping was declared and the port never opened.
  #
  # That is the isolation doing its job, and it has a design consequence worth
  # stating: the API cannot be usefully run on the host against a containerised
  # Valkey. Development runs the API as a container on `backend` (below), which
  # is the production shape anyway. Host-side tests use fakeredis instead of
  # reaching for a real one.

  api:
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      VEILIX_LOG_LEVEL: debug

  # Prometheus is deliberately NOT published, even here.
  #
  # It sits only on `backend`, which is internal:true and has no gateway, so a
  # ports: entry would be silently inert - the same measured behaviour as
  # Valkey above. That is the right outcome regardless: Prometheus has no
  # authentication at all. Inspect it with
  #   docker exec veilix-prometheus wget -qO- http://127.0.0.1:9090/api/v1/targets
  # or reach it through Grafana, which is what it is there for.

  grafana:
    ports:
      - "127.0.0.1:13000:3000"
