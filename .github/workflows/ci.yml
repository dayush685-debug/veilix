name: CI

# Every job here mirrors a command that was run locally first. A pipeline step
# nobody has executed by hand is a step that fails on the first push for
# reasons unrelated to the code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, because the dependency and container scans find things that appear
  # without anyone touching the repository. A scan that only runs on push is a
  # scan that misses every CVE published on a quiet week.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  # Cancel superseded runs on a branch, never on main — a cancelled main run
  # leaves the default branch with no verdict.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev,otel]"

      - name: Format check
        # --check, not a rewrite: CI reports, it does not silently reformat and
        # leave the working tree differing from what the author pushed.
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Tests
        # Coverage floor set just under the current 89%, so an accidental drop
        # fails while ordinary variation does not. A floor at exactly the
        # current number turns every refactor into a coverage argument.
        run: pytest tests -q --cov --cov-report=term --cov-report=xml --cov-fail-under=85

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        # `ci`, not `install`: installs exactly what the lockfile pins and
        # fails rather than quietly resolving a different tree.
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  config-checks:
    name: Configuration consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Compose files are valid
        run: |
          # Placeholder secrets: `config` only interpolates, it never connects
          # to anything, so these prove the files parse without needing real
          # values.
          export SEARXNG_SECRET=ci-placeholder-not-a-real-secret
          export GRAFANA_ADMIN_PASSWORD=ci-placeholder
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml --profile observability config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Only the edge publishes ports
        # SearXNG runs with JSON output on and its own bot limiter off, which is
        # safe ONLY while it is unreachable (SF-004). Publishing it would create
        # an open, unauthenticated, abusable search API — so this fails the
        # build instead of shipping.
        run: |
          export SEARXNG_SECRET=ci-placeholder-not-a-real-secret
          docker compose -f docker-compose.yml config --format json |
          python -c "
          import json,sys
          services = json.load(sys.stdin)['services']
          offenders = [n for n, s in services.items() if (s.get('ports') or []) and n != 'caddy']
          if offenders:
              sys.exit(f'FAIL: these services publish host ports: {offenders}')
          print('OK: only the edge publishes ports')
          "

      - name: CSP hash matches the inline theme script
        # Without this the failure is silent and reproducible only in
        # production: the browser refuses to run the snippet and dark-mode
        # users get a white flash.
        run: ./scripts/check-csp-hash.sh

      - name: No secrets are tracked
        run: |
          if git ls-files | grep -qE '(^|/)\.env$|\.pem$|\.key$'; then
            echo "FAIL: a secret file is tracked by git"
            git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'
            exit 1
          fi
          echo "OK: no secret files tracked"

      - name: .env.example covers every variable the code reads
        # Catches the Phase 6 bug directly: a variable the code reads that no
        # example documents is one an operator will never set, so the feature
        # it controls silently does nothing.
        #
        # Extracted to a script rather than inlined here, because the first
        # inline version got the alias handling wrong and reported a variable
        # that cannot exist. A check worth running is worth being able to run
        # locally.
        run: python scripts/check-env-coverage.py

  # ---------------------------------------------------------------------------
  images:
    name: Build and scan images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          tags: veilix-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/caddy/Dockerfile
          tags: veilix-web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: API image runs as non-root
        # Verified against the built image, not trusted from the
        # Dockerfile, because a base-image change can silently reset USER.
        run: |
          uid=$(docker run --rm --entrypoint id veilix-api:ci -u)
          [ "$uid" = "10001" ] || { echo "FAIL: API image runs as uid $uid"; exit 1; }
          echo "OK: API image runs as uid $uid"

      - name: API image ships no package manager
        # pip and setuptools were both CVE sources and are pure attack surface
        # at runtime: without them an attacker with code execution cannot
        # install a payload.
        run: |
          if docker run --rm --entrypoint sh veilix-api:ci -c 'command -v pip || command -v pip3'; then
            echo "FAIL: pip is present in the runtime image"
            exit 1
          fi
          echo "OK: no pip in the runtime image"

      - name: API package is the real one, not the build stub
        # The Dockerfile installs a stub first for layer caching. Without
        # --force-reinstall the stub ships instead, and the image starts,
        # serves traffic, and reports version 0.0.0 — a failure that looks
        # exactly like success.
        run: |
          v=$(docker run --rm --entrypoint python veilix-api:ci -c 'import veilix; print(veilix.__version__)')
          [ "$v" != "0.0.0" ] || { echo "FAIL: the placeholder package shipped"; exit 1; }
          echo "OK: package version $v"

      - name: Tracing dependency is present
        # Setting VEILIX_OTLP_ENDPOINT without this does nothing at all — a
        # documented configuration knob that lies (SF-012).
        run: |
          docker run --rm --entrypoint python veilix-api:ci -c 'import opentelemetry.sdk' \
            || { echo "FAIL: the otel extra is missing from the image"; exit 1; }
          echo "OK: otel SDK present"

      - name: Scan images
        # --ignore-unfixed is the gate. Failing on findings with no published
        # fix produces a build no available action can make green, and a gate
        # nobody can satisfy is a gate everybody learns to bypass. Accepted
        # findings live in .trivyignore, each with a reason and an expiry.
        run: |
          for image in veilix-api:ci veilix-web:ci; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:latest image \
                --scanners vuln --severity HIGH,CRITICAL \
                --ignore-unfixed --exit-code 1 --quiet "$image"
          done

  # ---------------------------------------------------------------------------
  stack:
    name: Stack verification and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [images]
    # Upstream search engines are reached from a GitHub runner here, and they
    # rate-limit datacentre IPs aggressively. The suite tolerates degraded
    # results by design, but a total upstream block would still fail it — so
    # this job reports instead of gates. It is the one place where the
    # honest choice is a warning, because the failure would not be ours.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate a throwaway environment
        run: |
          python - <<'PY'
          import secrets, pathlib, subprocess
          key = f"vlx_{secrets.token_urlsafe(32)}"
          digest = subprocess.run(
              ["python", "-c",
               f"import hashlib;print(hashlib.sha256({key!r}.encode()).hexdigest())"],
              capture_output=True, text=True, check=True).stdout.strip()
          pathlib.Path('.env').write_text('\n'.join([
              'VEILIX_ENV=development',
              f'SEARXNG_SECRET={secrets.token_hex(32)}',
              f'VEILIX_RATELIMIT_SALT_SEED={secrets.token_hex(32)}',
              f'VEILIX_API_KEY_HASHES={digest}',
              'VEILIX_ADMIN_USERNAME=admin',
              # Argon2 hash of a throwaway password, generated at run time.
              'VEILIX_SITE_ADDRESS=:8080',
              'VEILIX_HTTP_PORT=8088',
              'VEILIX_PUBLIC_URL=http://localhost:8088',
              'VEILIX_RATELIMIT_REQUESTS=600',
          ]) + '\n', encoding='utf-8')
          pathlib.Path('.ci-api-key').write_text(key, encoding='utf-8')
          PY
          pip install argon2-cffi
          python -c "
          from argon2 import PasswordHasher
          import pathlib
          h = PasswordHasher().hash('ci-throwaway-password')
          p = pathlib.Path('.env')
          p.write_text(p.read_text(encoding='utf-8') + f'VEILIX_ADMIN_PASSWORD_HASH={h}\n', encoding='utf-8')
          "

      - name: Start the stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
          # Wait on health rather than sleeping: SearXNG's engine initialisation
          # takes a variable 30-60s on a cold start.
          for i in $(seq 1 60); do
            healthy=$(docker ps --filter health=healthy --format '{{.Names}}' | grep -c veilix || true)
            [ "$healthy" -ge 4 ] && break
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.dev.yml ps

      - name: Verify architectural claims
        run: ./scripts/verify-stack.sh

      - name: End-to-end
        run: |
          cd tests/e2e
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium

      - name: Diagnostics on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=80

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v

  # ---------------------------------------------------------------------------
  ci-passed:
    # A single required check for branch protection. Without it, adding a job
    # means editing the protection rules, and someone eventually forgets.
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, config-checks, images]
    if: always()
    steps:
      - name: Verdict
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "CI failed"; exit 1 ;;
            *) echo "CI passed" ;;
          esac
