apiVersion: 1

providers:
  - name: veilix
    orgId: 1
    type: file
    disableDeletion: true
    # The dashboard JSON is version-controlled, so the file is the source of
    # truth. allowUiUpdates would let an edit in the browser diverge from the
    # repository and be lost on the next deploy.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
